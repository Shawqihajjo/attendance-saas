services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      php:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  php:
    image: attendance-php:dev
    build:
      context: ./docker/php
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/usr/local/bin/attendance-entrypoint:ro
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET}
      TRUSTED_PROXIES: REMOTE_ADDR
      DEFAULT_URI: http://localhost:8080
      PLATFORM_DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.4&charset=utf8mb4
      TENANT_DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/tenant_placeholder?serverVersion=8.4&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f
      PLATFORM_HOSTNAME: ${PLATFORM_HOSTNAME:-localhost}
      TENANT_DB_CREDENTIALS_KEY: ${TENANT_DB_CREDENTIALS_KEY}
      TENANT_DB_CREDENTIALS_KEY_ID: ${TENANT_DB_CREDENTIALS_KEY_ID:-dev}
      TENANT_DATABASE_DRIVER: mysql
      TENANT_DATABASE_HOST: mysql
      TENANT_DATABASE_PORT: "3306"
      TENANT_DATABASE_USER_HOST: "%"
      TENANT_DATABASE_ADMIN_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306
      TENANT_DATABASE_SERVER_VERSION: "8.4"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  messenger:
    image: attendance-php:dev
    build:
      context: ./docker/php
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M", "--limit=500", "-vv"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/usr/local/bin/attendance-entrypoint:ro
      - messenger_cache:/var/www/html/var/cache
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET}
      TRUSTED_PROXIES: REMOTE_ADDR
      DEFAULT_URI: http://localhost:8080
      PLATFORM_DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.4&charset=utf8mb4
      TENANT_DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/tenant_placeholder?serverVersion=8.4&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f
      PLATFORM_HOSTNAME: ${PLATFORM_HOSTNAME:-localhost}
      TENANT_DB_CREDENTIALS_KEY: ${TENANT_DB_CREDENTIALS_KEY}
      TENANT_DB_CREDENTIALS_KEY_ID: ${TENANT_DB_CREDENTIALS_KEY_ID:-dev}
      TENANT_DATABASE_DRIVER: mysql
      TENANT_DATABASE_HOST: mysql
      TENANT_DATABASE_PORT: "3306"
      TENANT_DATABASE_USER_HOST: "%"
      TENANT_DATABASE_ADMIN_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306
      TENANT_DATABASE_SERVER_VERSION: "8.4"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      HOME: /tmp
      VITE_API_PROXY: http://nginx
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      php:
        condition: service_started

  mysql:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  frontend_modules:
  messenger_cache:
