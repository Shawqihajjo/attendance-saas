# Staging and production. Development stays on docker-compose.yml.
# docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

# Override ATTENDANCE_PHP_IMAGE / ATTENDANCE_NGINX_IMAGE to pin GHCR digests/tags
# (for example ghcr.io/<owner>/attendance-php:sha-<commit>). Local builds still work
# when those variables are unset (default attendance-*:prod tags).
x-php-image: &php-image
  image: ${ATTENDANCE_PHP_IMAGE:-attendance-php:prod}
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod

x-app-environment: &app-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-REMOTE_ADDR}
  DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI is required}
  PLATFORM_HOSTNAME: ${PLATFORM_HOSTNAME:?PLATFORM_HOSTNAME is required}
  LOG_LEVEL: ${LOG_LEVEL:-error}
  PLATFORM_DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-platform}?serverVersion=8.4&charset=utf8mb4"
  TENANT_DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/tenant_placeholder?serverVersion=8.4&charset=utf8mb4"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f"
  TENANT_DB_CREDENTIALS_KEY: ${TENANT_DB_CREDENTIALS_KEY:?TENANT_DB_CREDENTIALS_KEY is required}
  TENANT_DB_CREDENTIALS_KEY_ID: ${TENANT_DB_CREDENTIALS_KEY_ID:?TENANT_DB_CREDENTIALS_KEY_ID is required}
  TENANT_DATABASE_DRIVER: mysql
  TENANT_DATABASE_HOST: mysql
  TENANT_DATABASE_PORT: "3306"
  TENANT_DATABASE_USER_HOST: "${TENANT_DATABASE_USER_HOST:-%}"
  TENANT_DATABASE_ADMIN_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306"
  TENANT_DATABASE_SERVER_VERSION: "8.4"
  MEDIA_LOCAL_DIRECTORY: ${MEDIA_LOCAL_DIRECTORY:-/var/www/html/var/photos}
  MESSENGER_TIME_LIMIT: ${MESSENGER_TIME_LIMIT:-3600}
  MESSENGER_MEMORY_LIMIT: ${MESSENGER_MEMORY_LIMIT:-128M}
  MESSENGER_MESSAGE_LIMIT: ${MESSENGER_MESSAGE_LIMIT:-500}

services:
  nginx:
    image: ${ATTENDANCE_NGINX_IMAGE:-attendance-nginx:prod}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    environment:
      TLS_TERMINATION: ${TLS_TERMINATION:-nginx}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  php:
    <<: *php-image
    environment:
      <<: *app-environment
    volumes:
      - media_data:/var/www/html/var/photos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "bin/console", "app:diagnostics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  messenger:
    <<: *php-image
    command: ["/usr/local/bin/attendance-worker"]
    environment:
      <<: *app-environment
    volumes:
      - media_data:/var/www/html/var/photos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(str_contains((string) file_get_contents(\"/proc/1/cmdline\"), \"messenger:consume\") ? 0 : 1);' && php bin/console app:diagnostics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=0
      - --skip-symbolic-links
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-platform}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/backup-databases.sh:/usr/local/bin/backup-databases.sh:ro
      - backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  media_data:
  backups:
