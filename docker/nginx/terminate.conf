map $scheme $forwarded_proto {
    default $scheme;
}

map $forwarded_proto $https_flag {
    https on;
    default off;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /api/v1/health {
        include /etc/nginx/snippets/php-api.conf;
    }

    location = /api/v1/health/ready {
        include /etc/nginx/snippets/php-api.conf;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:attendance_ssl:10m;
    include /etc/nginx/snippets/app.conf;
}
