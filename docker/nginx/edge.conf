map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $forwarded_proto $https_flag {
    https on;
    default off;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    include /etc/nginx/snippets/app.conf;
}
